<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | PROYECTO ONU</title>
    
    <!-- Fuentes de Google: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- CABECERA Y NAVEGACIÓN -->
    <header class="main-header">
        <a href="./" class="logo-link">
            <!-- AQUÍ VA EL LOGO DEL COLEGIO (TAMAÑO AUMENTADO) -->
            <img src="assets/img/logo_iades.png" alt="Logo IADES" style="max-height: 100px;">
        </a>

        <!-- BOTÓN HAMBURGUESA -->
        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- MENÚ DE NAVEGACIÓN -->
        <nav class="main-nav">
            <ul id="nav-list">
                <li><a href="./" class="active">INICIO</a></li>
                <li><a href="discursos/">DISCURSOS</a></li>
                <li><a href="reflexion/">REFLEXIÓN</a></li>
                <li><a href="fotos/">FOTOS</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- SECCIÓN DE IMÁGENES (CARRUSEL) -->
        <section id="hero" class="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active" style="background-color: #d1d5db;">
                    <p class="temp-text">Imagen del Proyecto 1</p>
                </div>
                <div class="carousel-item" style="background-color: #9ca3af;">
                    <p class="temp-text">Imagen del Proyecto 2</p>
                </div>
                <div class="carousel-item" style="background-color: #6b7280;">
                    <p class="temp-text">Imagen del Proyecto 3</p>
                </div>
                <div class="carousel-item" style="background-color: #4b5563;">
                    <p class="temp-text">Imagen del Proyecto 4</p>
                </div>
            </div>

            <!-- BOTONES CORREGIDOS PARA QUE SEAN CÍRCULOS PERFECTOS -->
            <button class="carousel-control prev" onclick="moveSlide(-1)" style="width: 60px; height: 60px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <button class="carousel-control next" onclick="moveSlide(1)" style="width: 60px; height: 60px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </section>

        <!-- SECCIÓN: SLOGAN (TÍTULO PRINCIPAL) -->
        <section id="slogan" class="slogan-section">
            <div class="container">
                <h2>PROYECTO ONU</h2>
            </div>
        </section>

        <!-- SECCIÓN: DESCRIPCIÓN DEL PROYECTO -->
        <section id="about" class="about-section">
            <div class="container">
                <p>
                    Acá iría la descripción del proyecto ONU.
                </p>
            </div>
        </section>
    </main>

    <!-- PIE DE PÁGINA (FOOTER) - FONDO NEGRO Y MENÚ CENTRADO -->
    <footer class="main-footer" style="background-color: #000000;">
        <div class="footer-top container" style="display: flex; justify-content: center; align-items: center;">
            
            <!-- Navegación Centrada -->
            <div class="footer-col footer-nav" style="text-align: center;">
                <ul style="align-items: center;">
                    <li><a href="./">INICIO</a></li>
                    <li><a href="discursos/">DISCURSOS</a></li>
                    <li><a href="reflexion/">REFLEXIÓN</a></li>
                    <li><a href="fotos/">FOTOS</a></li>
                </ul>
            </div>

        </div>
    </footer>

    <!-- BOTÓN VOLVER ARRIBA -->
    <button id="btnVolverArriba" title="Volver al inicio">
        <i class="fa-solid fa-chevron-up"></i>
    </button>

    <!-- SCRIPT DEL CARRUSEL Y BOTÓN -->
    <script>
        // --- LÓGICA DEL CARRUSEL ---
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-item');
        const totalSlides = slides.length;
        let slideInterval;

        function updateCarousel() {
            for (let i = 0; i < totalSlides; i++) {
                slides[i].classList.remove('active');
            }
            slides[currentSlide].classList.add('active');
        }

        function moveSlide(direction) {
            currentSlide += direction;
            if (currentSlide >= totalSlides) {
                currentSlide = 0;
            } else if (currentSlide < 0) {
                currentSlide = totalSlides - 1;
            }
            updateCarousel();
            resetInterval();
        }

        function autoPlay() {
            moveSlide(1);
        }

        function resetInterval() {
            clearInterval(slideInterval);
            slideInterval = setInterval(autoPlay, 5000);
        }

        slideInterval = setInterval(autoPlay, 5000);


        // --- LÓGICA DEL BOTÓN "VOLVER ARRIBA" ---
        const btnVolver = document.getElementById("btnVolverArriba");

        // Detecta el scroll de la página
        window.onscroll = function() {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btnVolver.classList.add("mostrar");
            } else {
                btnVolver.classList.remove("mostrar");
            }
        };

        // Al hacer clic, sube suavemente
        btnVolver.addEventListener("click", function() {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
    </script>

    <!-- SCRIPT PARA CELULARES -->
    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        mobileMenu.addEventListener('click', () => {
            mobileMenu.classList.toggle('open');
            navList.classList.toggle('active');
        });
    </script>
</body>
</html>

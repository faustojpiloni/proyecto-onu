<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos | PROYECTO ONU</title>
    
    <!-- Fuentes de Google: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <!-- CABECERA Y NAVEGACIÓN -->
    <header class="main-header">
        <a href="../" class="logo-link">
            <img src="../assets/img/logo_iades.png" alt="Logo IADES" style="max-height: 100px;">
        </a>

        <!-- BOTÓN HAMBURGUESA -->
        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- MENÚ DE NAVEGACIÓN -->
        <nav class="main-nav">
            <ul id="nav-list">
                <li><a href="../">INICIO</a></li>
                <li><a href="../discursos/">DISCURSOS</a></li>
                <li><a href="../reflexion/">REFLEXIÓN</a></li>
                <li><a href="./" class="active">FOTOS</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- SECCIÓN: TÍTULO -->
        <section class="hero-discursos" style="background-image: none;">
            <h1>FOTOS</h1>
        </section>

        <!-- SECCIÓN: CARRUSEL DE IMÁGENES (Fondo Blanco) -->
        <section class="detalle-galeria-section bg-white" style="padding-top: 60px; padding-bottom: 60px;">
            <div class="container">
                <div class="carousel-proyecto-wrapper">
                    <button class="carousel-btn prev-btn" id="btnPrevCarousel" aria-label="Foto anterior">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    
                    <div class="carousel-proyecto-track-container">
                        <ul class="carousel-proyecto-track" id="trackCarousel">
                            <li class="carousel-slide current-slide">
                                <!-- Reemplazar los divs por etiquetas <img> con sus rutas reales cuando las subas -->
                                <div class="img-placeholder" style="background-color: #e6e6e6;"></div>
                            </li>
                            <li class="carousel-slide">
                                <div class="img-placeholder" style="background-color: #cccccc;"></div>
                            </li>
                            <li class="carousel-slide">
                                <div class="img-placeholder" style="background-color: #b3b3b3;"></div>
                            </li>
                            <li class="carousel-slide">
                                <div class="img-placeholder" style="background-color: #999999;"></div>
                            </li>
                            <li class="carousel-slide">
                                <div class="img-placeholder" style="background-color: #808080;"></div>
                            </li>
                        </ul>
                    </div>

                    <button class="carousel-btn next-btn" id="btnNextCarousel" aria-label="Siguiente foto">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- PIE DE PÁGINA (FOOTER) -->
    <footer class="main-footer">
        <div class="footer-top container" style="display: flex; justify-content: center; align-items: center;">
            <div class="footer-col footer-nav" style="text-align: center;">
                <ul style="align-items: center;">
                    <li><a href="../">INICIO</a></li>
                    <li><a href="../discursos/">DISCURSOS</a></li>
                    <li><a href="../reflexion/">REFLEXIÓN</a></li>
                    <li><a href="./">FOTOS</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <!-- BOTÓN VOLVER ARRIBA -->
    <button id="btnVolverArriba" class="btn-volver-arriba" title="Volver arriba">
        <i class="fa-solid fa-chevron-up"></i>
    </button>

    <!-- SCRIPT DEL CARRUSEL Y NAVEGACIÓN -->
    <script>
        // --- LÓGICA DEL CARRUSEL DE FOTOS ---
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        const totalSlides = slides.length;
        const btnNext = document.getElementById('btnNextCarousel');
        const btnPrev = document.getElementById('btnPrevCarousel');
        let slideInterval;

        // Preparamos los slides para el efecto de transición (Fade)
        slides.forEach((slide, index) => {
            slide.style.transition = "opacity 0.6s ease-in-out";
            if (index !== 0) {
                slide.style.opacity = "0";
                slide.style.zIndex = "0";
            } else {
                slide.style.opacity = "1";
                slide.style.zIndex = "1";
            }
        });

        function updateCarousel() {
            for (let i = 0; i < totalSlides; i++) {
                slides[i].classList.remove('current-slide');
                slides[i].style.opacity = "0";
                slides[i].style.zIndex = "0";
            }
            slides[currentSlide].classList.add('current-slide');
            slides[currentSlide].style.opacity = "1";
            slides[currentSlide].style.zIndex = "1";
        }

        function moveSlide(direction) {
            currentSlide += direction;
            
            if (currentSlide >= totalSlides) {
                currentSlide = 0;
            } else if (currentSlide < 0) {
                currentSlide = totalSlides - 1;
            }
            
            updateCarousel();
            resetInterval();
        }

        function autoPlay() {
            moveSlide(1);
        }

        function resetInterval() {
            clearInterval(slideInterval);
            slideInterval = setInterval(autoPlay, 5000);
        }

        if (btnNext) {
            btnNext.addEventListener('click', () => moveSlide(1));
        }
        if (btnPrev) {
            btnPrev.addEventListener('click', () => moveSlide(-1));
        }

        if (totalSlides > 0) {
            slideInterval = setInterval(autoPlay, 5000);
        }

        // --- LÓGICA DEL BOTÓN "VOLVER ARRIBA" ---
        const btnVolver = document.getElementById("btnVolverArriba");

        if (btnVolver) {
            window.onscroll = function() {
                if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                    btnVolver.classList.add("mostrar");
                } else {
                    btnVolver.classList.remove("mostrar");
                }
            };
            btnVolver.addEventListener("click", function() {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }

        // --- SCRIPT PARA MENU CELULARES ---
        const mobileMenu = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        if (mobileMenu) {
            mobileMenu.addEventListener('click', () => {
                mobileMenu.classList.toggle('open');
                navList.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
